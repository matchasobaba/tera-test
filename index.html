<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>第一回 寺テスト</title>
    <style>
        :root { --test-paper-bg: #ffffff; --ink-black: #1a1a1a; --stamp-red: #e63946; }
        body { background-color: #d0dce4; font-family: 'Noto Serif JP', serif; padding: 20px; }
        .test-sheet { background-color: white; max-width: 850px; margin: auto; padding: 40px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .question-block { margin-bottom: 40px; position: relative; }
        .mark-badge { position: absolute; top: -10px; left: -10px; font-size: 4rem; color: var(--stamp-red); opacity: 0.5; pointer-events: none; }
        .process-area { width: 100%; height: 160px; border: 1px solid #777; padding: 10px; resize: vertical; margin-bottom: 10px; }
        .final-answer input { width: 300px; height: 35px; border: 2px solid #555; padding: 5px; font-size: 1.1rem; }
        .svg-container { float: left; margin: 0 20px 20px 0; }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>
    <div class="test-sheet">
        <h1>第一回 寺テスト</h1>
        
        <form id="jukuTestForm">
            <!-- 大問3 -->
            <div class="question-section">
                <div class="section-title">【大問3】連立方程式</div>
                <div class="question-block">
                    <div class="mark-badge" id="mark_q3_1"></div>
                    <div>（1）式を作りなさい。</div>
                    <textarea class="process-area" name="process_q3_1"></textarea>
                </div>
                <div class="question-block">
                    <div class="mark-badge" id="mark_q3_2"></div>
                    <div>（2）ノートとペンの値段を求めなさい。</div>
                    <textarea class="process-area" name="process_q3_2"></textarea>
                    <div class="final-answer"><input type="text" name="ans_q3_2" placeholder="答えを記入"></div>
                </div>
            </div>

            <!-- 大問4 -->
            <div class="question-section clearfix">
                <div class="section-title">【大問4】図形</div>
                <div class="svg-container">
                    <svg width="220" height="180" viewBox="0 0 220 180">
                        <rect x="20" y="80" width="80" height="80" fill="#c4b5fd" stroke="black" stroke-width="2"/>
                        <rect x="100" y="20" width="140" height="140" fill="#bbf7d0" stroke="black" stroke-width="2"/>
                        <!-- 引き出し線で7cmを明示 -->
                        <line x1="20" y1="160" x2="100" y2="20" stroke="black" stroke-width="2"/>
                        <line x1="100" y1="20" x2="140" y2="20" stroke="black" stroke-dasharray="4"/>
                        <line x1="20" y1="160" x2="60" y2="160" stroke="black" stroke-dasharray="4"/>
                        <line x1="140" y1="20" x2="140" y2="0" stroke="black"/>
                        <line x1="60" y1="160" x2="60" y2="180" stroke="black"/>
                        <text x="100" y="0" font-size="16" font-weight="bold">7cm</text>
                    </svg>
                </div>
                <div class="question-block">
                    <div class="mark-badge" id="mark_q4"></div>
                    <div>（1）2つの正方形の面積の合計を求めなさい。</div>
                    <textarea class="process-area" name="process_q4"></textarea>
                    <div class="final-answer"><input type="text" name="ans_q4" placeholder="答えを記入"></div>
                </div>
            </div>
            
            <button type="button" onclick="grade()">提出する</button>
        </form>
    </div>

    <script>
        function grade() {
            // 簡易判定ロジック
            alert("テストを提出しました（採点ロジックは用途に合わせて調整してください）");
        }
    </script>
</body>
</html>
